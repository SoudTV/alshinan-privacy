<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>خريطة حائل التفاعلية ثلاثية الأبعاد</title><link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>html,body,#map{height:100%;width:100%;margin:0;overflow:hidden;background:#071126}*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{opacity:.55}.badge{position:absolute;left:14px;bottom:116px;z-index:2;padding:8px 12px;border:1px solid #ffffff4d;border-radius:18px;color:#fff;background:#050f236b;backdrop-filter:blur(18px);font-size:12px}.marker{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #ffffffe6;box-shadow:0 7px 18px #00000059;background:#e9ae35}.marker:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;left:5.5px;top:5.5px}.maplibregl-popup-content{direction:rtl;border-radius:18px!important;background:#0a1223c7!important;color:#fff!important;backdrop-filter:blur(18px);border:1px solid #ffffff47;padding:12px 14px!important}.maplibregl-popup-tip{display:none}</style></head><body><div id="map"></div><div id="count" class="badge">جاري تحميل أماكن حائل…</div><script>function boot(){const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[41.6973,27.5132],zoom:12.2,pitch:62,bearing:-18,antialias:true,attributionControl:false,maxPitch:85});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-left');let markers=[];function colorFor(c=''){c=c.toLowerCase();if(c.includes('جبل')||c.includes('mount'))return'#8a5cf6';if(c.includes('وادي')||c.includes('شعب'))return'#30aeda';if(c.includes('أثر')||c.includes('تراث'))return'#bd7542';if(c.includes('مطعم'))return'#f08b32';if(c.includes('كاف'))return'#8e6248';if(c.includes('منتزه'))return'#42a65a';return'#e9ae35'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.setHailTheme=function(n){document.body.style.background=n?'#030817':'#9bd5f0';map.setFog(n?{color:'#081026','high-color':'#17285b','space-color':'#02040d','horizon-blend':.18}:{color:'#cbe9f5','high-color':'#87cbe9','space-color':'#6e8fae','horizon-blend':.1})};window.setHailPlaces=function(places){markers.forEach(m=>m.remove());markers=[];const b=new maplibregl.LngLatBounds();places.forEach(p=>{if(!Number.isFinite(p.latitude)||!Number.isFinite(p.longitude))return;const e=document.createElement('div');e.className='marker';e.style.background=colorFor(p.category||'');const pop=new maplibregl.Popup({offset:22,closeButton:false}).setHTML('<b>'+esc(p.name||'مكان في حائل')+'</b><br><small>'+esc(p.category||'')+'</small>');const m=new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat([p.longitude,p.latitude]).setPopup(pop).addTo(map);markers.push(m);b.extend([p.longitude,p.latitude])});document.getElementById('count').textContent=markers.length+' مكانًا معتمدًا';if(!b.isEmpty())map.fitBounds(b,{padding:{top:150,bottom:150,left:70,right:70},pitch:58,bearing:-18,duration:1300,maxZoom:14})};map.on('load',()=>{if(map.getSource('openmaptiles')){try{map.addLayer({id:'hail-3d-buildings',source:'openmaptiles','source-layer':'building',type:'fill-extrusion',minzoom:12,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],['get','height'],8],0,'#d8c39c',25,'#d6a95d',80,'#7f91a8'],'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.88}})}catch(e){}}window.webkit?.messageHandlers?.hailMapReady?.postMessage('ready')});}const loader=document.createElement("script");loader.src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js";loader.onload=boot;document.head.appendChild(loader);</script></body></html>
